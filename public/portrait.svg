<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1428"/>
      <stop offset="0.55" stop-color="#261b3a"/>
      <stop offset="1" stop-color="#110d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a16"/>
      <stop offset="1" stop-color="#191026"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#a855f7" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#dots)"/>
  <rect width="640" height="800" fill="url(#glow)"/>

  <!-- soft studio light -->
  <ellipse cx="320" cy="215" rx="185" ry="185" fill="#c084fc" fill-opacity="0.1"/>

  <!-- stylised silhouette -->
  <g fill="url(#figure)">
    <circle cx="320" cy="318" r="104"/>
    <path d="M118 800c0-142 90-236 202-236s202 94 202 236H118Z"/>
  </g>
  <path d="M238 250a104 104 0 0 1 164 0c-24-30-52-46-82-46s-58 16-82 46Z" fill="#2a1f3d" fill-opacity="0.9"/>

  <!-- accent ring -->
  <circle cx="320" cy="318" r="132" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1.5"/>

  <text x="320" y="742" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="25" font-weight="600" fill="#d8b4fe" fill-opacity="0.9">Anamika Mukherjee</text>
  <text x="320" y="772" text-anchor="middle" font-family="monospace" font-size="14" fill="#a1a1b5" fill-opacity="0.85">B.Tech CSE '27</text>
</svg>
